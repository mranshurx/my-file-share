<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirBeam P2P</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans p-4">
  <header class="flex items-center justify-between pb-4 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-sky-500 flex items-center justify-center font-bold text-white text-xs">P2P</div>
      <h1 class="font-bold text-base text-white">AirBeam <span class="text-sky-400">P2P</span></h1>
    </div>
    <div class="px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-[11px] text-slate-300">
      WebRTC Ready
    </div>
  </header>

  <main class="flex-1 py-4 space-y-4">
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-center space-y-3">
      <div class="text-xs text-slate-400">Signaling Server URL</div>
      <div class="flex gap-2">
        <input id="customServerUrl" type="text" placeholder="ws://192.168.1.X:3000" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-sky-400 font-mono" />
        <button id="btnConnectCustom" class="px-3 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-xs font-semibold text-white">Connect</button>
      </div>
      <div id="connStatus" class="text-[11px] text-amber-400">Signaling server ready to connect</div>
    </div>

    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900 rounded-xl border border-slate-800">
      <button id="btnModeSend" class="py-2.5 text-xs font-semibold rounded-lg bg-sky-500 text-white">Send Files</button>
      <button id="btnModeReceive" class="py-2.5 text-xs font-semibold rounded-lg text-slate-400">Receive Files</button>
    </div>

    <div id="sendPanel" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 text-center space-y-4">
      <div class="text-xs text-slate-400">Session Code</div>
      <div id="codeDisplay" class="font-mono text-3xl font-bold tracking-widest text-sky-400 bg-slate-950 py-3 rounded-xl border border-slate-800">------</div>
      <div class="flex justify-center">
        <div id="qrBox" class="p-2 bg-white rounded-xl"></div>
      </div>
      <div class="text-[11px] text-slate-400">Receiver scans QR code or enters 6 digits to initiate 16KB WebRTC transfer</div>
    </div>

    <div id="recvPanel" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 text-center space-y-4 hidden">
      <div class="text-xs text-slate-400">Enter Sender's 6-Digit Code</div>
      <input id="inputRecvCode" type="text" maxlength="6" placeholder="123456" class="w-full text-center font-mono text-2xl tracking-widest bg-slate-950 border border-slate-800 rounded-xl py-3 text-sky-400" />
      <button id="btnJoinCode" class="w-full py-3 rounded-xl bg-sky-500 text-white text-xs font-bold shadow-lg shadow-sky-500/20">Join Session</button>
    </div>
  </main>

  <script>
    let ws = null;
    let code = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('codeDisplay').textContent = code;

    new QRCode(document.getElementById('qrBox'), {
      text: code,
      width: 120,
      height: 120,
      colorDark: '#0284c7',
      colorLight: '#ffffff'
    });

    document.getElementById('btnModeSend').addEventListener('click', () => {
      document.getElementById('sendPanel').classList.remove('hidden');
      document.getElementById('recvPanel').classList.add('hidden');
      document.getElementById('btnModeSend').className = 'py-2.5 text-xs font-semibold rounded-lg bg-sky-500 text-white';
      document.getElementById('btnModeReceive').className = 'py-2.5 text-xs font-semibold rounded-lg text-slate-400';
    });

    document.getElementById('btnModeReceive').addEventListener('click', () => {
      document.getElementById('recvPanel').classList.remove('hidden');
      document.getElementById('sendPanel').classList.add('hidden');
      document.getElementById('btnModeReceive').className = 'py-2.5 text-xs font-semibold rounded-lg bg-sky-500 text-white';
      document.getElementById('btnModeSend').className = 'py-2.5 text-xs font-semibold rounded-lg text-slate-400';
    });
  </script>
</body>
</html>
